<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Glow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #060112;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* 🌌 KOINOT FON VA ANIMATSIYALAR */
        .universe-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a082e 0%, #05010d 100%);
            z-index: -3;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.4;
            animation: pulseStars 8s infinite alternate;
        }

        @keyframes pulseStars {
            0% { opacity: 0.3; }
            100% { opacity: 0.6; }
        }

        /* 🌙 OY TIZIMI */
        .moon {
            position: fixed;
            top: 15%;
            right: 10%;
            width: 60px;
            height: 60px;
            background: url('https://i.imgur.com/G96V7f9.png') no-repeat center/cover, #e1e5f2;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(225, 229, 242, 0.4);
            z-index: -1;
        }

        /* 🛰️ SPUTNIK ANIMATSIYASI */
        .sputnik {
            position: fixed;
            width: 30px;
            height: 30px;
            color: #00f0ff;
            font-size: 20px;
            z-index: -1;
            animation: orbit 20s linear infinite;
        }

        @keyframes orbit {
            0% { transform: translate(-50px, 100vh) rotate(0deg); }
            50% { transform: translate(calc(100vw + 50px), 20vh) rotate(180deg); }
            100% { transform: translate(-50px, -10vh) rotate(360deg); }
        }

        /* ✨ NEON LOGO (ANIMATSIYALI) */
        .header {
            text-align: center;
            padding: 25px 15px 15px;
        }

        .bot-logo {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px #9d4edd, 0 0 20px #9d4edd;
            animation: neonGlow 2s ease-in-out infinite alternate;
        }

        .bot-logo span {
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        @keyframes neonGlow {
            0% { text-shadow: 0 0 10px #9d4edd, 0 0 20px #9d4edd; }
            100% { text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f; transform: scale(1.02); }
        }

        /* 🟣 FIOLETOVIY NEON INTERFEYS */
        .search-container {
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 14px 20px;
            background: rgba(26, 8, 46, 0.6);
            border: 2px solid #9d4edd;
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
            border-radius: 30px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .search-bar:focus {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        .page-content {
            display: none;
            padding: 0 20px;
        }

        .page-content.active {
            display: block;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* CARD STYLES */
        .neon-card {
            background: rgba(20, 6, 38, 0.7);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img-box {
            height: 130px;
            background: #120424;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #9d4edd;
            position: relative;
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff007f;
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
        }

        .card-body {
            padding: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            height: 38px;
            overflow: hidden;
        }

        .card-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #9d4edd, #ff007f);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        /* VIP CARD */
        .vip-box {
            background: linear-gradient(135deg, rgba(30, 3, 66, 0.9), rgba(255, 0, 127, 0.2));
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-top: 20px;
        }

        .vip-price {
            font-size: 28px;
            color: #00f0ff;
            font-weight: 900;
            margin: 15px 0;
            text-shadow: 0 0 10px #00f0ff;
        }

        /* NAVBAR TIZIMI */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 2, 21, 0.95);
            border-top: 2px solid #9d4edd;
            box-shadow: 0 -5px 20px rgba(157, 78, 221, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8a8194;
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .nav-item.active {
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f;
        }
    </style>
</head>
<body>

    <div class="universe-bg"></div>
    <div class="stars"></div>
    <div class="moon"></div>
    <i class="fas fa-satellite sputnik"></i>

    <div class="header">
        <div class="bot-logo">Kino Glow<span>.uz</span></div>
    </div>

    <!-- 🔍 QIDIRUV -->
    <div class="search-container" id="search-section">
        <input type="text" id="search-input" class="search-bar" placeholder="Kino kodini kiriting...">
    </div>

    <!-- 🎬 KINO & SERIAL BO'LIMI -->
    <div id="movie-page" class="page-content active">
        <div class="grid-layout" id="movies-container">
            <!-- Kinolar avtomat bazadan bu yerga keladi -->
        </div>
    </div>

    <!-- 🎵 MUSIQA BO'LIMI -->
    <div id="music-page" class="page-content">
        <div class="grid-layout" id="music-container">
            <!-- Musiqalar shu yerga keladi -->
        </div>
    </div>

    <!-- ⭐️ VIP OBUNA BO'LIMI (ESKILIGICHA) -->
    <div id="vip-page" class="page-content">
        <div class="vip-box">
            <h2 style="color: #ffbc00; text-shadow: 0 0 10px #ffbc00;">⭐️ OYLIK VIP OBUNA</h2>
            <p style="margin-top: 10px; color: #ccc;">Barcha premyera kinolar va cheksiz yuklab olish imkoniyati!</p>
            <div class="vip-price">100 Telegram Stars</div>
            <button class="card-btn" style="border-radius: 25px; padding: 12px;" onclick="payVIP()">Hozir Obuna Bo'lish</button>
        </div>
    </div>

    <!-- 👤 PROFIL BO'LIMI -->
    <div id="profile-page" class="page-content">
        <div class="vip-box" style="border-color: #9d4edd; box-shadow: 0 0 15px rgba(157,78,221,0.4);">
            <i class="fas fa-user-astronaut" style="font-size: 60px; color: #9d4edd; margin-bottom: 15px;"></i>
            <h2 id="username">Kosmonavt</h2>
            <p style="color: #00f0ff; margin-top: 5px;">Status: Premium Foydalanuvchi</p>
        </div>
    </div>

    <!-- 📱 NAVBAR -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchPage('movie-page', this)"><i class="fas fa-film"></i><span>Kinolar</span></div>
        <div class="nav-item" onclick="switchPage('music-page', this)"><i class="fas fa-music"></i><span>Musiqa</span></div>
        <div class="nav-item" onclick="switchPage('vip-page', this)"><i class="fas fa-star"></i><span>VIP</span></div>
        <div class="nav-item" onclick="switchPage('profile-page', this)"><i class="fas fa-user"></i><span>Profil</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        function switchPage(pageId, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
            
            // Qidiruv panelini faqat kino va musiqa bo'limida ko'rsatish
            document.getElementById('search-section').style.display = (pageId === 'movie-page' || pageId === 'music-page') ? 'block' : 'none';
        }

        function payVIP() {
            tg.showAlert("Eski obuna tizimi bo'yicha: Kodni to'g'ridan-to'g'ri bot ichiga yozib tomosha qiling!");
        }
    </script>
</body>
</html>
