<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino Glow | Premium Neon Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #030008;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 95px;
        }

        /* Fon Elementlari */
        .universe-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #17042b 0%, #06010f 70%, #020005 100%);
            z-index: -3;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-image: 
                radial-gradient(#ffaa00, rgba(255,170,0,.15) 1.5px, transparent 30px),
                radial-gradient(#b388ff, rgba(179,136,255,.15) 2px, transparent 40px);
            background-size: 300px 300px, 450px 450px;
            opacity: 0.45;
            animation: spaceMove 40s linear infinite;
        }

        @keyframes spaceMove {
            from { background-position: 0 0, 0 0; }
            to { background-position: 300px 600px, -450px 450px; }
        }

        /* Header va Logo */
        .header { text-align: center; padding: 35px 15px 20px; }
        .bot-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 10px #b388ff, 0 0 25px #8a2be2;
            animation: neonPulse 2.5s ease-in-out infinite alternate;
        }
        .bot-logo span { color: #ff6600; text-shadow: 0 0 10px #ff6600, 0 0 30px #ff3300; }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 12px #b388ff, 0 0 20px #8a2be2; transform: scale(1); }
            100% { text-shadow: 0 0 25px #ff6600, 0 0 40px #ff3300; transform: scale(1.02); }
        }

        /* Qidiruv va Tablar */
        .search-container { padding: 0 20px; margin-bottom: 25px; }
        .search-bar {
            width: 100%; padding: 16px 25px; background: rgba(17, 5, 31, 0.75);
            border: 2px solid #8a2be2; border-radius: 16px; color: #ffffff; outline: none;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.2); transition: all 0.4s;
        }
        .search-bar:focus { border-color: #ff6600; box-shadow: 0 0 25px rgba(255, 102, 0, 0.45); }
        
        .filter-tabs { display: flex; gap: 12px; padding: 0 20px; margin-bottom: 25px; overflow-x: auto; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 11px 24px; background: rgba(21, 7, 36, 0.5); border: 1px solid rgba(138, 43, 226, 0.4); border-radius: 14px; font-size: 14px; font-weight: 600; color: #cbbad6; cursor: pointer; }
        .tab.active { background: linear-gradient(135deg, #8a2be2, #ff6600); border-color: transparent; color: #ffffff; box-shadow: 0 0 20px rgba(255, 102, 0, 0.4); }

        /* Sahifalar */
        .page-content { display: none; padding: 0 20px; animation: cubicBlurIn 0.5s ease; }
        .page-content.active { display: block; }
        @keyframes cubicBlurIn { from { opacity: 0; filter: blur(5px); } to { opacity: 1; filter: blur(0); } }

        .section-title { font-size: 21px; margin-bottom: 22px; font-weight: 800; border-left: 4px solid #ff6600; padding-left: 12px; text-shadow: 0 0 15px rgba(255,102,0,0.35); }
        .movies-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

        /* Kino Kartalari */
        .movie-card {
            background: linear-gradient(135deg, rgba(23, 7, 38, 0.85) 0%, rgba(11, 2, 20, 0.95) 100%);
            border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 20px; overflow: hidden;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transition: all 0.4s;
        }
        .movie-card:hover { border-color: #ff6600; box-shadow: 0 0 25px rgba(255, 102, 0, 0.35); transform: translateY(-5px); }
        .movie-img-container { position: relative; width: 100%; height: 155px; background: linear-gradient(45deg, #120321, #260742); display: flex; align-items: center; justify-content: center; }
        .badge-premium { position: absolute; top: 12px; left: 12px; background: linear-gradient(45deg, #ff6600, #ffaa00); padding: 4px 9px; border-radius: 7px; font-size: 10px; font-weight: 800; color: #000; box-shadow: 0 0 12px rgba(255, 102, 0, 0.5); }
        .movie-info { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .movie-title { font-size: 14px; font-weight: 600; height: 38px; overflow: hidden; margin-bottom: 12px; color: #f3ebfc; }
        .movie-meta { display: flex; justify-content: space-between; font-size: 12px; color: #a497b8; margin-bottom: 14px; }

        /* Tugmalar */
        .card-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #8a2be2 0%, #ff6600 100%);
            color: #ffffff; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.35); transition: all 0.3s;
        }
        .card-btn:hover { box-shadow: 0 0 20px rgba(255, 102, 0, 0.6); }

        /* 🚨 IN-APP NEON PLEYER DIZAYNI */
        .player-page {
            display: none;
            padding: 0 20px;
            animation: cubicBlurIn 0.4s ease;
        }
        .player-wrapper {
            background: #0d041a;
            border: 2px solid #ff6600;
            box-shadow: 0 0 35px rgba(255, 102, 0, 0.4);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            border-radius: 16px;
            display: block;
            outline: none;
            background: #000;
        }
        .player-info {
            padding: 15px 5px;
        }
        .player-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* Navigatsiya */
        .navbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 72px; background: rgba(5, 1, 13, 0.94);
            border-top: 2px solid rgba(138, 43, 226, 0.7); box-shadow: 0 -10px 30px rgba(138, 43, 226, 0.3);
            display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(20px); z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9283a8; font-size: 11px; font-weight: 600; cursor: pointer; width: 65px; transition: all 0.3s; }
        .nav-item i { font-size: 21px; margin-bottom: 5px; }
        .nav-item.active { color: #ff6600; text-shadow: 0 0 12px rgba(255, 102, 0, 0.6); }
        .nav-item.active i { transform: translateY(-5px) scale(1.15); }
    </style>
</head>
<body>

    <div class="universe-bg"></div>
    <div class="stars"></div>

    <div class="header" id="main-header">
        <div class="bot-logo">Kino Glow<span>.uz</span></div>
    </div>

    <div class="search-container" id="search-box">
        <input type="text" class="search-bar" placeholder="Kino yoki musiqa qidirish...">
    </div>

    <!-- 🎬 KINOLAR SAHIFASI -->
    <div id="home-page" class="page-content active">
        <h2 class="section-title">Kiber Premyeralar</h2>
        <div class="movies-grid">
            <!-- 1-Kino (Test havolasi qo'yilgan) -->
            <div class="movie-card">
                <div class="movie-img-container">
                    <span class="badge-premium">4K ULTRA</span>
                    <i class="fas fa-film" style="font-size:46px; color: #ff6600;"></i>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Avatar: Suv yo'li (Premium)</div>
                    <div class="movie-meta"><span>2022</span><span>👁️ 8.9k</span></div>
                    <!-- Haqiqiy mp4 video linkini 'url' ichiga yozasiz -->
                    <button class="card-btn" onclick="openInAppPlayer('Avatar: Suv yo\'li', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">🚀 Tomosha Qilish</button>
                </div>
            </div>
            <!-- 2-Kino -->
            <div class="movie-card">
                <div class="movie-img-container">
                    <span class="badge-premium">HD 1080p</span>
                    <i class="fas fa-film" style="font-size:46px; color: #8a2be2;"></i>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Interstellar (Tarjima)</div>
                    <div class="movie-meta"><span>2014</span><span>👁️ 5.4k</span></div>
                    <button class="card-btn" onclick="openInAppPlayer('Interstellar', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">🚀 Tomosha Qilish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📺 IN-APP NEON VIDEO PLEYER SAHIFASI -->
    <div id="player-page" class="player-page">
        <div class="player-wrapper">
            <video id="neon-html5-player" controls playsinline>
                <source id="player-source" src="" type="video/mp4">
                Brauzeringiz videoni qo'llab-quvvatlamaydi.
            </video>
        </div>
        <div class="player-info">
            <h1 id="playing-movie-title" class="player-title">Kino Nomi</h1>
            <p style="color: #b388ff; font-size: 14px; margin-bottom: 20px;"><i class="fas fa-signal" style="color: #ff6600;"></i> Yuqori tezlikdagi kiber striming</p>
            <button class="card-btn" onclick="closeInAppPlayer()" style="background: linear-gradient(135deg, #ff3300 0%, #ff6600 100%); font-weight:800;"><i class="fas fa-arrow-left"></i> ORQAGA QAYTISH</button>
        </div>
    </div>

    <!-- 📱 BOTTOM NAVBAR -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchPage('home-page', this)"><i class="fas fa-film"></i><span>Kinolar</span></div>
        <div class="nav-item" onclick="switchPage('player-page', this)" style="display:none;" id="nav-hidden-player"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Sahifalarni almashtirish funksiyasi
        function switchPage(pageId, element) {
            // Videoni to'xtatish (agar pleyerdan chiqib ketsa)
            if (pageId !== 'player-page') {
                document.getElementById('neon-html5-player').pause();
            }

            document.querySelectorAll('.page-content, .player-page').forEach(p => p.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId).style.display = 'block';
            if(element) element.classList.add('active');

            // Header va qidiruvni pleyerda yashirish
            if (pageId === 'player-page') {
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('search-box').style.display = 'none';
            } else {
                document.getElementById('main-header').style.display = 'block';
                document.getElementById('search-box').style.display = 'block';
            }
        }

        // Mini App ichida pleyerni ochish va videoni qo'yish
        function openInAppPlayer(title, videoUrl) {
            const player = document.getElementById('neon-html5-player');
            const source = document.getElementById('player-source');
            const titleElem = document.getElementById('playing-movie-title');

            titleElem.innerText = title;
            source.src = videoUrl;
            
            switchPage('player-page', null);
            
            player.load();
            player.play().catch(error => {
                console.log("Avtomatik ijro etish bloklandi, foydalanuvchi bosishi kutilmoqda.");
            });
        }

        // Pleyerni yopib ortga qaytish
        function closeInAppPlayer() {
            switchPage('home-page', document.querySelector('.nav-item'));
        }
    </script>
</body>
</html>
