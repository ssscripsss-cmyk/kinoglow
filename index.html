qDOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinoglow | Bepul Kinolar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* SIZNING ASL CSS DIZAYNINGIZ SHU YERDA QOLADI */
        /* (892 qatorli kodingizdagi <style> ichidagi hamma narsani shu yerga qo'ying) */
        body { background: #0d0221; color: #ffffff; }
        .movies-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .movie-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="home-page" class="page-content active">
        <div id="movies-container" class="movies-grid">
            </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/cslc4pn5n9sq2";

        async function loadMovies() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const container = document.getElementById('movies-container');
                
                container.innerHTML = data.map(m => `
                    <div class="movie-card" onclick="window.Telegram.WebApp.openTelegramLink('${m.url}')">
                        <div class="movie-title">${m.title}</div>
                        <div class="movie-meta"><span>#${m.code}</span></div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Xatolik:", err);
            }
        }

        // Sahifa yuklanganda ishga tushirish
        window.onload = loadMovies;
        
        // Telegram Web App init
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>

    </body>
</html>
