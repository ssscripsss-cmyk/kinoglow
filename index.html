<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinoglow</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
margin:0;
font-family:Arial;
background:#05010d;
color:white;
overflow-x:hidden;
}

/* 🌌 KO'K YULDUZLI FON */
.stars{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.4;
animation:move 120s linear infinite;
z-index:-1;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(-1000px);}
}

/* HEADER */
header{
text-align:center;
padding:20px;
font-size:24px;
font-weight:bold;
text-shadow:0 0 10px #9d4edd;
}

header span{color:#ff007f}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:#0d0221;
padding:10px 0;
border-top:1px solid #333;
}

.nav div{
text-align:center;
font-size:12px;
color:#aaa;
cursor:pointer;
}

.nav div.active{
color:#ff007f;
}

/* PAGE */
.page{
display:none;
padding:15px;
}

.page.active{
display:block;
}

/* CARDS */
.card{
background:#120022;
padding:10px;
margin:10px 0;
border-radius:12px;
box-shadow:0 0 10px #9d4edd33;
}

button{
background:#9d4edd;
border:none;
padding:8px;
color:white;
border-radius:8px;
width:100%;
margin-top:5px;
cursor:pointer;
}

button:hover{
background:#ff007f;
}

</style>
</head>

<body>

<div class="stars"></div>

<header>Kinoglow<span>.uz</span></header>

<!-- HOME -->
<div id="home" class="page active">
<h3>🎬 Kinolar</h3>

<div class="card">
Interstellar
<button onclick="openMovie('Interstellar')">Ko‘rish</button>
</div>

<div class="card">
Avengers
<button onclick="openMovie('Avengers')">Ko‘rish</button>
</div>

</div>

<!-- MUSIC -->
<div id="music" class="page">

<h3>🎵 Musiqa</h3>

<div class="card">
Imagine Dragons - Believer
<button onclick="openMusic('Believer')">Eshitish</button>
</div>

<div class="card">
Alan Walker - Faded
<button onclick="openMusic('Faded')">Eshitish</button>
</div>

</div>

<!-- VIP -->
<div id="vip" class="page">

<h3>👑 VIP</h3>

<div class="card">1 oy - 100 ⭐</div>
<div class="card">3 oy - 200 ⭐</div>
<div class="card">6 oy - 300 ⭐</div>
<div class="card">1 yil - 400 ⭐</div>

</div>

<!-- PROFILE -->
<div id="profile" class="page">

<h3>👤 Profil</h3>

<div class="card">
Telegram foydalanuvchi
</div>

</div>

<!-- NAV -->
<div class="nav">
<div class="active" onclick="show('home',this)">🏠</div>
<div onclick="show('music',this)">🎵</div>
<div onclick="show('vip',this)">⭐</div>
<div onclick="show('profile',this)">👤</div>
</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

/* PAGE SWITCH */
function show(id,el){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.nav div').forEach(n=>n.classList.remove('active'));

document.getElementById(id).classList.add('active');
el.classList.add('active');
}

/* MOVIE CLICK */
function openMovie(name){
addView(name);
tg.showAlert("🎬 Kino: " + name);
}

/* MUSIC CLICK */
function openMusic(name){
addView(name);
tg.showAlert("🎵 Musiqa: " + name);
}

/* ⭐ VIEW SYSTEM */
let views = JSON.parse(localStorage.getItem("views") || "{}");

function addView(id){
if(!views[id]) views[id] = 0;
views[id] += 1;
localStorage.setItem("views", JSON.stringify(views));
}

/* VIP */
function buyVIP(plan){
tg.showAlert("⭐ VIP tanlandi: " + plan);
}

</script>
